<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">imageflow/fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Helvetica Neue</family><family>PingFang SC</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Songti SC</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Menlo</family></prefer></alias>
</fontconfig>
